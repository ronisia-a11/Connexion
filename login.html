<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f2f2f2;
    }
    .login-container {
      max-width: 400px;
      margin: 100px auto;
      padding: 30px;
      background-color: cornflowerblue;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .btn{
      margin-right: 12px;
      background-color: aqua;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <h3 class="text-center">CONNEXION</h3>
    <div class="mb-3">
      <label for="login" class="form-label">Login</label>
      <input type="text" id="login" class="form-control">
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Mot de passe</label>
      <input type="password" id="password" class="form-control">
    </div>
    <button class="btn btn-primary w-100" onclick="checkLogin()">Connexion</button>
    <p class="mt-3 text-center text-danger" id="message"></p>
  </div>

  <script>
    function checkLogin() {
        const login = document.getElementById("login").value.trim();
      const password = document.getElementById("password").value.trim();
      const msg = document.getElementById("message");

      if (login !== "MOI") {
        msg.textContent = "Login incorrect";
      } else if (password !== "moi-aussi") {
        msg.textContent = "Mot de passe incorrect";
      } else {
        msg.textContent = "";
        alert("Connexion réussie !");
        // Simuler ouverture de nouveau formulaire :
        window.location.href = "formulaire.html "; // à remplacer par votre page
      }
    }
  </script>
</body>
</html>
